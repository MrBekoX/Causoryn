name: Bug report
description: Report a reproducible bug in Causoryn (never post security vulnerabilities here — see SECURITY.md)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! For security vulnerabilities, please do **not** open a public issue — use GitHub Private Vulnerability Reporting as described in `SECURITY.md`.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear, concise description of the bug and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal commands, MCP tool call payload, or repository fixture needed to reproduce the issue.
      placeholder: |
        1. Run `npx causoryn@0.2.0 doctor`
        2. Call `causoryn_map_system` with ...
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host / client environment
      options:
        - Antigravity
        - Claude Code
        - Codex
        - ZCode (GLM)
        - Standalone stdio / CLI
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment details
      description: Causoryn version, OS/arch, Node.js version, and relevant sidecar toolchain versions (`dotnet`, `python`, `go`, `cargo`).
      placeholder: "causoryn 0.2.0, Ubuntu 24.04 x64, Node 24.x"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant stderr logs or diagnostics
      description: Paste sanitized stderr output (remove any sensitive paths or tokens).
      render: text
