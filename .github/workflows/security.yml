name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  zizmor:
    name: Workflow Security Audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor workflow audit
        uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          inputs: "."
          collect: "default"
          strict-collection: true
          persona: "regular"
          min-severity: "medium"
          advanced-security: false
          annotations: true
          fail-on-no-inputs: true

  dependency-review:
    name: Dependency Review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: "GPL-2.0, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0, LGPL-3.0-only, LGPL-3.0-or-later"
          comment-summary-in-pr: never
          show-openssf-scorecard: true
          show-patched-versions: true

  dependency-audit:
    name: Multi-Ecosystem Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Audit npm dependencies (high+)
        run: npm audit --audit-level=high

      - name: Audit NuGet dependencies (fail-closed JSON, all severities)
        run: |
          # Intentionally stricter than npm high+: fails closed on any NuGet vulnerability
          # (Low/Moderate/High/Critical) and on any NuGet audit problem (including NU1900 warnings).
          dotnet restore native/roslyn-worker/Causoryn.RoslynWorker.csproj --locked-mode
          node -e '
            const cp = require("node:child_process");
            const res = cp.spawnSync(
              "dotnet",
              [
                "list",
                "native/roslyn-worker/Causoryn.RoslynWorker.csproj",
                "package",
                "--vulnerable",
                "--include-transitive",
                "--format",
                "json",
              ],
              { encoding: "utf8" },
            );
            if (res.status !== 0) {
              console.error(res.stderr || res.stdout);
              process.exit(res.status ?? 1);
            }
            const report = JSON.parse(res.stdout);
            const problems = report.problems ?? [];
            if (problems.length > 0) {
              console.error("NuGet audit problems (fail-closed, includes NU1900 warnings):", JSON.stringify(problems, null, 2));
              process.exit(1);
            }
            const sources = report.sources ?? [];
            const hasNugetFeed = sources.some((src) => String(src).includes("api.nuget.org"));
            if (!hasNugetFeed) {
              console.error("NuGet audit did not query live api.nuget.org advisory source (fail-closed):", sources);
              process.exit(1);
            }
            const projects = report.projects ?? [];
            if (projects.length === 0) {
              console.error("NuGet audit returned 0 projects (fail-closed)");
              process.exit(1);
            }
            const findings = [];
            // Note: .NET 10 omits the `frameworks` array on projects with 0 vulnerable packages.
            for (const proj of projects) {
              for (const fw of proj.frameworks ?? []) {
                for (const pkg of [...(fw.topLevelPackages ?? []), ...(fw.transitivePackages ?? [])]) {
                  for (const vuln of pkg.vulnerabilities ?? []) {
                    findings.push({
                      project: proj.path,
                      framework: fw.framework,
                      package: pkg.id,
                      version: pkg.resolvedVersion,
                      severity: vuln.severity,
                      advisoryurl: vuln.advisoryurl,
                    });
                  }
                }
              }
            }
            if (findings.length > 0) {
              console.error("Vulnerable NuGet packages detected:", JSON.stringify(findings, null, 2));
              process.exit(1);
            }
            console.log(`NuGet vulnerability audit passed: ${projects.length} project(s), ${sources.length} source(s), 0 vulnerabilities.`);
          '
