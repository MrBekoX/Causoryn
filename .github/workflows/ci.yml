name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Nightly run at an off-peak hour; it also covers the Apple Silicon leg.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Merge gate (push / pull_request): Linux, Windows and macOS on GitHub's
        # Intel x64 macOS pool (macos-26-intel, a standard runner).
        # The standard macOS arm64 pool (macos-15, macos-26, macos-latest) has
        # been capacity constrained since late October 2026: during peak hours
        # (roughly 12:00-23:00 UTC) jobs wait 15 minutes and are cancelled with
        # "The job was not acquired by Runner of type hosted even after multiple
        # attempts", which blocked merges for reasons unrelated to the code.
        # The nightly schedule (off-peak) and manual dispatch add the Apple
        # Silicon leg (macos-26). GitHub ends Intel macOS images in 2027:
        # move the gate back to arm64 before then.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","windows-latest","macos-26-intel","macos-26"]' || '["ubuntu-latest","windows-latest","macos-26-intel"]') }}
    steps:
      - name: Harden Runner (Linux)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "native/go-worker/go.mod"
          cache: false

      - name: Setup Rust
        # Pinned dtolnay/rust-toolchain (stable branch commit; no upstream semver tag)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit npm dependencies (high+)
        run: npm audit --audit-level=high

      - name: Build Roslyn worker (deterministic Release, locked)
        run: dotnet build native/roslyn-worker/Causoryn.RoslynWorker.csproj -c Release -p:DebugType=none -p:ContinuousIntegrationBuild=true -p:SatelliteResourceLanguages=en -p:RestoreLockedMode=true

      - name: Build Rust worker (locked)
        run: cargo build --manifest-path native/rust-worker/Cargo.toml --locked

      - name: Typecheck
        run: npm run typecheck

      - name: Build packages and adapters
        run: npm run build

      - name: Build MCP server bundle
        run: npm run build:bundle --workspace packages/mcp-server

      - name: Build distribution package
        run: npm run build:package --workspace packages/causoryn

      - name: Verify distribution package readiness
        run: node packages/causoryn/scripts/verify-package-ready.mjs

      - name: Lint
        run: npm run lint

      - name: Secret scan
        run: npm run secret-scan

      - name: Verify public export leak gate
        run: node scripts/export-public-tree.mjs --verify-temp --ref HEAD

      - name: Run test suite
        run: npm test
