[package]
name = "causoryn-rust-worker"
# Internal analyzer protocol version (locked to protocol::ANALYZER_VERSION & SQLite analyzerFingerprint; independent of causoryn package release version).
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Causoryn Rust sidecar worker: local, deterministic analysis based on syn 3."

# Dependency contract: only syn 3 (AST; Cargo.lock pins 3.0.10) + serde_json (JSON).
# Fetching these crates from crates.io is the counterpart of the Roslyn worker's
# NuGet pattern. No other dependency (sha2, quote, clap, ...) is added; SHA-256
# is implemented without dependencies in src/sha256.rs and the acceptance tests
# check it against the Node crypto digest.
# proc-macro2 is syn's OWN dependency; it is listed here only to enable the
# "span-locations" feature (Span::start()/end() provide the evidence line
# numbers; without the feature no LineColumn information is produced).
[dependencies]
serde_json = "1"
syn = { version = "3", features = ["full", "visit", "printing", "parsing", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# debug profili adapter'ın beklenen binary konumudur:
# native/rust-worker/target/debug/causoryn-rust-worker(.exe)
